# CLA Flow production deployment.
# Coolify: point to this file or use the Dockerfile directly with a managed DB.
#
# Manual deploy:
#   1. Copy .env.example to .env and fill in POSTGRES_PASSWORD + CLA_ADMIN_EMAIL
#   2. docker compose up -d
#   3. App listens on 127.0.0.1:3000 — put Nginx/Caddy/Coolify proxy in front
#
# On first start the app runs migrations automatically (scripts/migrate.mjs).
# Create the admin account via: docker compose exec app sh
#   then use the psql command shown in the README.

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: codingladies
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: codingladies
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codingladies -d codingladies"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://codingladies:${POSTGRES_PASSWORD}@db:5432/codingladies
      CLA_ADMIN_EMAIL: ${CLA_ADMIN_EMAIL:-claude@codingladies.org}
      USHABTI_SIGNUP: closed
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
